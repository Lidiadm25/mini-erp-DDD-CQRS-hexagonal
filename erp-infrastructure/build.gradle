    api project(':erp-domain')
    api project(':erp-application')
    // Source: https://mvnrepository.com/artifact/org.postgresql/postgresql
    api("org.postgresql:postgresql:42.7.11")
    // Source: https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-data-jpa
    api("org.springframework.boot:spring-boot-starter-data-jpa")
    // Source: https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-data-mongodb
    api("org.springframework.boot:spring-boot-starter-data-mongodb")

    // Source: https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-data-redis
    api("org.springframework.boot:spring-boot-starter-data-redis")

    // Source: https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-cache
    api("org.springframework.boot:spring-boot-starter-cache")

