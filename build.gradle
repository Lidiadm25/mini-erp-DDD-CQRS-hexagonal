


plugins {
    id 'java'
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'org.springframework.boot' version '4.1.0' apply false
}


group = 'com.Lidiadm25'
version = '0.0.1-SNAPSHOT'

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    group = rootProject.group
    version = rootProject.version

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    repositories {
        mavenCentral()
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:4.1.0"
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'

        // Source: https://mvnrepository.com/artifact/org.projectlombok/lombok-mapstruct-binding
        implementation("org.projectlombok:lombok-mapstruct-binding:0.2.0")
        // Source: https://mvnrepository.com/artifact/org.mapstruct/mapstruct
        implementation("org.mapstruct:mapstruct:1.6.3")
        // Source: https://mvnrepository.com/artifact/org.mapstruct/mapstruct-processor
        annotationProcessor("org.mapstruct:mapstruct-processor:1.6.3")
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'
    }

    tasks.named('test') {
        useJUnitPlatform()
    }
}
